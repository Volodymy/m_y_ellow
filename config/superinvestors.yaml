# Портфелі реальних інвесторів зі звітів SEC 13F.
#
# ВАЖЛИВО:
# - 13F подається із затримкою до 45 днів після кінця кварталу і показує лише
#   довгі позиції в акціях США (без кешу, шортів, іноземних акцій).
# - Ваги нижче — знімок із відкритих оглядів. Точні цифри оновлюються командою
#   `python -m office fetch-13f` напряму з SEC EDGAR.
# - weight: null означає, що позиція є в топі, але точну вагу треба уточнити;
#   такі позиції пропускаються, доки їх не оновить fetch-13f.

